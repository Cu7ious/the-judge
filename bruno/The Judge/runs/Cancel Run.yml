info:
  name: Cancel Run
  type: http
  seq: 4
  tags:
    - runs

http:
  method: POST
  url: "{{baseUrl}}/v1/runs/{{runId}}/cancel"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cancels a pending/running evaluation run and its non-terminal case runs.

  Do NOT include this in a happy-path folder run — it will abort the run you just created.
  Use it only when you intentionally want to stop work.
