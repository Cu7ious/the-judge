info:
  name: 04 Create Case Germany
  type: http
  seq: 4
  tags:
    - smoke

http:
  method: POST
  url: "{{baseUrl}}/v1/suites/{{suiteId}}/cases"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "germany",
        "prompt": "What is the capital of Germany? Reply with one word only.",
        "validators": [{"type": "contains", "value": "Berlin"}],
        "timeout_ms": 60000,
        "position": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("creates germany case", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
