services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge
      POSTGRES_DB: judge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d judge"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://judge:judge@postgres:5432/judge?sslmode=disable
      REDIS_ADDR: redis:6379
      MIGRATIONS_DIR: /app/migrations
      LOG_LEVEL: info
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAX_RETRIES: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://judge:judge@postgres:5432/judge?sslmode=disable
      REDIS_ADDR: redis:6379
      LOG_LEVEL: info
      WORKER_CONCURRENCY: "4"
      MAX_RETRIES: "3"
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
